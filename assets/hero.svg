<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">8mem hero banner</title>
  <desc id="desc">A polished gold and blue hero banner for 8mem, the agent memory layer for AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.5" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f9fbff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f0c86d"/>
      <stop offset="1" stop-color="#f6df9a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#527cff"/>
      <stop offset="1" stop-color="#7fa8ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1b2a52" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="42" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="160" fill="#7fa8ff" opacity="0.16"/>
  <circle cx="200" cy="520" r="220" fill="#f0c86d" opacity="0.20"/>
  <path d="M78 118 C210 42 300 44 430 94 C564 146 644 132 772 74 C918 8 1058 52 1200 142" fill="none" stroke="#7fa8ff" stroke-width="2" opacity="0.28"/>
  <g filter="url(#soft)">
    <rect x="86" y="96" width="1108" height="448" rx="36" fill="#ffffff" opacity="0.86"/>
    <rect x="86" y="96" width="1108" height="448" rx="36" fill="none" stroke="#dbe6ff"/>
  </g>
  <g transform="translate(142 154)">
    <rect x="0" y="0" width="206" height="88" rx="24" fill="#0f1a33"/>
    <path d="M63 45c-17-22-43-20-52 0-9 21 13 42 52 0 39 42 61 21 52 0-9-20-35-22-52 0z" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="58" font-family="Verdana, sans-serif" font-size="45" font-weight="700" fill="#8caaff">mem</text>
  </g>
  <text x="142" y="312" font-family="Verdana, sans-serif" font-size="64" font-weight="800" fill="#101828">The memory your AI</text>
  <text x="142" y="382" font-family="Verdana, sans-serif" font-size="64" font-weight="800" fill="url(#blue)">can finally keep.</text>
  <text x="146" y="444" font-family="Verdana, sans-serif" font-size="25" fill="#475467">Local-first memory for Telegram, OpenClaw, Hermes, and agent runtimes.</text>
  <g transform="translate(792 172)">
    <rect x="0" y="0" width="312" height="270" rx="34" fill="#111827"/>
    <circle cx="156" cy="92" r="48" fill="url(#gold)"/>
    <path d="M115 122 C122 178 190 178 197 122" fill="none" stroke="#7fa8ff" stroke-width="12" stroke-linecap="round"/>
    <rect x="66" y="172" width="180" height="18" rx="9" fill="#f4f7ff"/>
    <rect x="92" y="206" width="128" height="14" rx="7" fill="#7fa8ff"/>
    <text x="58" y="250" font-family="Verdana, sans-serif" font-size="17" fill="#cbd5e1">visible. correctable. portable.</text>
  </g>
</svg>
